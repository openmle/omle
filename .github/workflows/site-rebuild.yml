name: Rebuild site

# docs/reference/ is generated from registries/ and checked in, so regenerated
# reference pages arrive as a push to main. The project site pulls all of docs/
# at build time, but nothing rebuilds it on its own — without this the site keeps
# serving the previous operator list until someone triggers a build by hand.
on:
  push:
    branches: [main]
    paths:
      # One entry now: the hand-written pages and the generated reference share
      # this tree. A stale "spec/**" here would silently stop matching.
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-site:
    name: Trigger site rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch content-updated to openmle.github.io
        env:
          # A PAT with `contents: write` on openmle/openmle.github.io. The
          # default GITHUB_TOKEN is scoped to this repository and cannot
          # dispatch to another one.
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set; skipping site rebuild."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/openmle/openmle.github.io/dispatches \
            -d "{\"event_type\":\"content-updated\",
                 \"client_payload\":{\"source\":\"omle\",\"sha\":\"${GITHUB_SHA}\"}}"
          echo "Requested a site rebuild for omle ${GITHUB_SHA}."

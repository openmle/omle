name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # Runs .pre-commit-config.yaml, the same file the local git hook runs, so the
  # two cannot drift. --all-files because a locally installed hook only ever
  # sees staged files, and nothing guarantees a contributor installed it at all.
  #
  # Once, on one interpreter: the config's local hooks (registry validation,
  # docs freshness, pytest) are version-independent, and the test matrix below
  # covers the interpreters.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      # The local hooks run with `language: system` and import the package, so
      # unlike the other repos this one does need it installed.
      - run: pip install -e ".[dev]"
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # --show-diff-on-failure prints the patch the autofixing hooks would have
      # applied, so a red build hands back the fix instead of just a rule name.
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/
